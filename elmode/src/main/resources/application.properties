spring.application.name=ingestion
elmode.cors.allowed-origins=http://localhost:3000

obd.port.name=COM3
obd.baud.rate=38400
obd.data.bits=8
obd.stop.bits=1
obd.parity=0
# Milliseconds to wait for a response before treating the read as timed out
obd.read.timeout.ms=2000
obd.write.timeout.ms=1000

# --- Polling ---
# Interval between PID poll cycles. Spec calls for ~100ms per active session;
# real ELM327 hardware over standard OBD-II (11500 baud effective) usually
# cannot sustain multi-PID polling faster than ~150-300ms without queuing.
# Tune per-adapter. Mock mode honors this value exactly.
obd.poll.interval.ms=150

# --- Database Configuration ---
spring.datasource.url=jdbc:postgresql://localhost:5432/elmode_db
spring.datasource.username=postgres
spring.datasource.password=jeremiah
spring.jpa.hibernate.ddl-auto=update

# --- Reconnection / Recovery ---
obd.reconnect.enabled=true
obd.reconnect.initial-backoff.ms=1000
obd.reconnect.max-backoff.ms=30000
obd.reconnect.backoff-multiplier=2.0
# After this many consecutive failed poll cycles, force a full port reset
obd.reconnect.failure-threshold=5

# --- Mock Mode ---
# When true, bypasses jSerialComm entirely and runs a physically-plausible
# telemetry simulator. Use this for desk/dev work with no hardware attached.
obd.mock.enabled=true
obd.mock.node-id=VEH-001

# --- Vehicle / Session identification ---
# IMPORTANT: this MUST match obd.mock.node-id while running in mock mode.
# ObdReaderService publishes scenario telemetry under obd.mock.node-id, but
# TelemetryController/DiagnosticsController default their nodeId query param
# to obd.vehicle.node-id. If these two values differ, GET /api/telemetry/latest
# and GET /api/diagnostics/latest will silently return empty results forever
# (querying a nodeId nothing is ever published under) even though the
# simulator and WebSocket broadcast are working correctly. Keep them equal
# unless you're intentionally running multiple named vehicle sessions.
obd.vehicle.node-id=VEH-001

# --- Logging ---
logging.level.com.elmode.ingestion=DEBUG
logging.level.com.fazecast.jSerialComm=INFO
logging.pattern.console=%d{HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n